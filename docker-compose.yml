services:
  watcher:
    build: .
    restart: unless-stopped
    # .env is gitignored, so it is absent on the server - Coolify injects the
    # vars from its UI instead. required:false keeps local runs working.
    env_file:
      - path: .env
        required: false
    volumes:
      # Named volume, not ./data - a redeploy re-clones the repo and would
      # take a bind mount with it, losing the baseline and replaying events.
      - lacerda-state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # --- Optional: separate egress IP -------------------------------------
    # This container shares the host IP with any real Discord session on the
    # same network. To route it elsewhere, add HTTPS_PROXY to .env, e.g.
    #   HTTPS_PROXY=http://user:pass@proxyhost:port
    # requests picks it up automatically; no code change needed. Use a
    # residential/mobile proxy if you do - free public ones have worse IP
    # reputation than a home connection and make the account more suspect.

volumes:
  lacerda-state:
