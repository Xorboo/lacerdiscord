name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Offline test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_diff.py

  docker:
    name: Docker build (what Coolify runs on deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ci-image .
